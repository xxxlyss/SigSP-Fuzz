# =============================================================================
# FuzzingBrain LLM Configuration
# =============================================================================
#
# Quick Start:
#   1. Copy this file to llm_config.local.yaml (won't be tracked by git)
#   2. Fill in your API key(s)
#   3. Choose your preferred model
#   4. Run: python -m fuzzingbrain.llms.test
#
# =============================================================================

# -----------------------------------------------------------------------------
# API Keys (required - fill at least one)
# -----------------------------------------------------------------------------
# Note: Use llm_config.local.yaml to store API keys to avoid leaking secrets
#
api_keys:
  # Anthropic (Claude) - https://console.anthropic.com/
  anthropic: ""

  # OpenAI (GPT) - https://platform.openai.com/api-keys
  openai: ""

  # Google (Gemini) - https://aistudio.google.com/apikey
  google: ""

  # xAI (Grok) - https://console.x.ai/
  xai: ""

  # DeepSeek - https://platform.deepseek.com/
  deepseek: ""

  # Qwen (DashScope) - https://dashscope.console.aliyun.com/
  qwen: ""


# -----------------------------------------------------------------------------
# Custom API Base URLs (optional)
# -----------------------------------------------------------------------------
# Use these to route API calls through proxies or compatible endpoints.
# For example, Alibaba Cloud Bailian provides an Anthropic-compatible endpoint:
#   anthropic: "https://dashscope.aliyuncs.com/apps/anthropic"
#
api_bases:
  # anthropic: ""
  # openai: ""
  # google: ""
  # xai: ""
  # deepseek: ""
  # qwen: ""


# -----------------------------------------------------------------------------
# Model Selection
# -----------------------------------------------------------------------------
# Available models:
#
# DeepSeek (primary for code analysis)
#   - deepseek-v4-pro     Strong code analysis, 128K context, $0.27/$1.09 per 1M
#
# Qwen (DashScope) - fast auxiliary
#   - qwen3.6-plus        Fast judgment/dedup, 128K context, $0.14/$0.56 per 1M
#
# Claude (Anthropic) - fallback
#   - claude-opus-4-5      $5/$25 per 1M tokens
#   - claude-sonnet-4-5    $3/$15 per 1M tokens
#   - claude-haiku-4-5     $1/$5 per 1M tokens
#
# GPT (OpenAI)
#   - gpt-5.2              $1.75/$14 per 1M tokens
#   - gpt-5.2-pro          $5/$40 per 1M tokens
#
# Gemini (Google)
#   - gemini-3-flash       $0.50/$3 per 1M tokens
#   - gemini-3-pro         $1.25/$5 per 1M tokens
#
# Grok (xAI)
#   - grok-3               $5/$15 per 1M tokens
#
default_model: deepseek-v4-pro


# -----------------------------------------------------------------------------
# Task-specific Models (optional)
# -----------------------------------------------------------------------------
# If not specified, uses default_model
#
task_models:
  # Code analysis - requires deep understanding
  code_analysis: deepseek-v4-pro

  # Code refactoring - large scale modifications
  code_refactor: deepseek-v4-pro

  # Fast coding - simple tasks
  fast_coding: qwen3.6-plus

  # Fast judgment - yes/no decisions
  fast_judgment: qwen3.6-plus

  # Complex reasoning - math/logic
  complex_reasoning: deepseek-v4-pro


# -----------------------------------------------------------------------------
# Agent Routing (optional — per-agent model assignment)
# -----------------------------------------------------------------------------
# Each agent role can be assigned a different model / provider.
# Change a value here to re-route that agent — no code changes needed.
# The model ID must be registered in fuzzingbrain/llms/models.py.
# If an agent role is not listed, it falls back to "default" → hardcoded constant.
#
# Available agent roles:
#   analyst_memory_corruption  - Agent A: memory corruption vulnerability analysis
#   analyst_logic_flaw         - Agent B: logic flaw vulnerability analysis
#   analyst_injection          - Agent C: injection vulnerability analysis
#   reviewer_memory_corruption - Reviewer A: reviews B+C SPs
#   reviewer_logic_flaw        - Reviewer B: reviews C+A SPs
#   reviewer_injection         - Reviewer C: reviews A+B SPs
#   firmware_sp_verifier       - Firmware SP verification
#   worker_sp_verifier         - Worker pipeline SP verification
#   worker_pov_agent           - Worker pipeline POV generation
#   attack_surface_identifier  - Attack surface identification
#   direction_planner          - Direction planning
#   poc_agent                  - POC generation (Phase 4)
#   context_compressor         - Context compression in agent loop
#   sp_dedup                   - SP deduplication
#   default                    - Catch-all fallback
#
agent_routing:
  # analyst_memory_corruption: deepseek-v4-pro
  # analyst_logic_flaw: deepseek-v4-pro
  # analyst_injection: qwen3.6-plus
  # reviewer_memory_corruption: deepseek-v4-pro
  # reviewer_logic_flaw: deepseek-v4-pro
  # reviewer_injection: qwen3.6-plus
  # firmware_sp_verifier: deepseek-v4-pro
  # worker_sp_verifier: claude-sonnet-4-5
  # worker_pov_agent: claude-sonnet-4-5
  # attack_surface_identifier: claude-sonnet-4-6
  # direction_planner: claude-sonnet-4-6
  # poc_agent: claude-sonnet-4-6
  # context_compressor: claude-sonnet-4-20250514
  # sp_dedup: claude-sonnet-4-6
  # default: deepseek-v4-pro


# -----------------------------------------------------------------------------
# Fallback Settings
# -----------------------------------------------------------------------------
# Automatically try other models when primary model fails
#
fallback:
  enabled: true
  max_attempts: 3


# -----------------------------------------------------------------------------
# Generation Parameters
# -----------------------------------------------------------------------------
generation:
  temperature: 0.1      # 0.0-1.0, higher = more random
  max_tokens: 8192      # Maximum output tokens
  timeout: 120          # Request timeout in seconds
