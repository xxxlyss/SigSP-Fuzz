# =============================================================================
# FuzzingBrain — Docker Compose (v2 + Firmware Analysis)
# =============================================================================
#
# Quick start:
#   docker compose up -d                           # Infrastructure only
#   docker compose --profile task up -d             # All services
#   docker compose --profile firmware up -d         # Firmware analysis stack
#
# Services:
#   fb-mongo        MongoDB (data storage)
#   fb-redis        Redis (task queue + coverage cache)
#   fb-task         FuzzingBrain task worker (software fuzzing)
#   fb-firmware     FuzzingBrain firmware analysis (Ghidra + QEMU + AFL++)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  fb-mongo:
    image: mongo:8.0
    container_name: fb-mongo
    restart: unless-stopped
    volumes:
      - fb-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  fb-redis:
    image: redis:7-alpine
    container_name: fb-redis
    restart: unless-stopped
    volumes:
      - fb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Software Fuzzing Task Worker (original)
  # ---------------------------------------------------------------------------

  fb-task:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FUZZINGBRAIN_HOST_WORKSPACE:-${PWD}/workspace}:${FUZZINGBRAIN_HOST_WORKSPACE:-${PWD}/workspace}
      - ${PWD}:${PWD}:ro
      - ${PWD}/logs:/app/logs
    environment:
      MONGODB_URL: "mongodb://fb-mongo:27017"
      MONGODB_DB: "fuzzingbrain"
      REDIS_URL: "redis://fb-redis:6379/0"
      RUNNING_IN_DOCKER: "true"
      FUZZINGBRAIN_WORKSPACE_BASE: "${FUZZINGBRAIN_HOST_WORKSPACE:-${PWD}/workspace}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    depends_on:
      fb-mongo:
        condition: service_healthy
      fb-redis:
        condition: service_healthy
    profiles:
      - task

  # ---------------------------------------------------------------------------
  # Firmware Analysis Service (NEW)
  # ---------------------------------------------------------------------------

  fb-firmware:
    build:
      context: .
      dockerfile: Dockerfile.firmware
    image: fuzzingbrain-firmware:latest
    container_name: fb-firmware
    restart: "no"
    volumes:
      - ${FIRMWARE_DIR:-./firmware}:/firmware:ro
      - ${RESULTS_DIR:-./results}:/results
      - /tmp/qemu_snapshots:/tmp/qemu_snapshots
      - /tmp/qemu_monitors:/tmp/qemu_monitors
    environment:
      MONGODB_URL: "mongodb://fb-mongo:27017"
      MONGODB_DB: "fuzzingbrain"
      REDIS_URL: "redis://fb-redis:6379/0"
      GHIDRA_HOME: "/opt/ghidra"
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    depends_on:
      fb-mongo:
        condition: service_healthy
      fb-redis:
        condition: service_healthy
    profiles:
      - firmware
    # Run with: docker compose --profile firmware run --rm fb-firmware analyze-firmware --firmware /firmware/router.bin

  # ---------------------------------------------------------------------------
  # Firmware Worker (long-running fuzzing, NEW)
  # ---------------------------------------------------------------------------

  fb-firmware-worker:
    build:
      context: .
      dockerfile: Dockerfile.firmware
    image: fuzzingbrain-firmware:latest
    container_name: fb-firmware-worker
    restart: unless-stopped
    volumes:
      - ${FIRMWARE_DIR:-./firmware}:/firmware:ro
      - ${RESULTS_DIR:-./results}:/results
      - /tmp/qemu_snapshots:/tmp/qemu_snapshots
      - /tmp/qemu_monitors:/tmp/qemu_monitors
    environment:
      MONGODB_URL: "mongodb://fb-mongo:27017"
      MONGODB_DB: "fuzzingbrain"
      REDIS_URL: "redis://fb-redis:6379/0"
      GHIDRA_HOME: "/opt/ghidra"
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    entrypoint: ["python3", "-m", "celery", "-A", "fuzzingbrain.celery_app", "worker"]
    depends_on:
      fb-mongo:
        condition: service_healthy
      fb-redis:
        condition: service_healthy
    profiles:
      - firmware-worker

# =============================================================================
# Volumes
# =============================================================================

volumes:
  fb-mongo-data:
  fb-redis-data:
